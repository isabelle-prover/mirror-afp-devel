title = "Steiner's Line Theorem in Isabelle/HOL"
date = 2026-10-06
topics = [
  "Mathematics/Geometry",
]
abstract = "We formalize Steiner's line theorem in Isabelle/HOL. For a nondegenerate triangle and a point on its circumcircle, the reflections of that point in the three sidelines are collinear, and the resulting line passes through the orthocenter. The development uses complex coordinates and imports the published Wallace–Simson line entry for its perpendicular-foot and collinearity infrastructure."
license = "bsd"
note = ""
creation_note = """

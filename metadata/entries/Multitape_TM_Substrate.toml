2026-10-28 = """
Added theories of constructions shared by the entries built on the
substrate: facts about runs, relabelling, tape embedding, endmarker
normalisation, exact unary clocks and a machine/clock product, a binary
codec, and enum instances for finite index types.  Renamed the model so
that it can be imported beside Multitape_To_Singletape_TM (mttm becomes
ktm, dir becomes move, the mt_ prefix becomes ktc_).  Removed lemmas that
duplicated HOL or each other.  Updated abstract.
"""


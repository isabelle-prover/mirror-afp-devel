title = "Multitape Alphabet Enlargement"
date = 2026-07-14
topics = [
  "Computer science/Automata and formal languages",
]
abstract = """
<p>Machine-checked Isabelle/HOL proof of the linear speedup theorem for multitape Turing machines, in deterministic and nondeterministic form, via the alphabet-enlargement construction. The theorem originates with Hartmanis and Stearns; the textbook proof followed here, together with its nondeterministic corollary, is due to Hopcroft and Ullman.</p>

<p>Given a machine \\(M\\) and block size \\(m > 0\\), the enlarged machine \\(M' = \\mathrm{alphabet\\_enlarge}\\, m\\, M\\), over alphabet \\(\\Sigma_M^m \\cup \\{\\Box, \\rhd\\}\\), simulates \\(m\\) steps of \\(M\\) per step, reading its input in blocks of \\(m\\) symbols; a wrapping step folds the block encoding back in so results compare languages over \\(M\\)'s original alphabet.</p>

<p>The session <tt>Multitape_Alphabet_Enlargement</tt> shows that \\(M'\\) accepts the encoded input iff \\(M\\) accepts \\(w\\), and that if \\(M\\) accepts \\(w\\) in time \\(T(n)\\) then \\(M'\\) does so in time \\(2\\lceil n/m\\rceil + 8\\lceil T(n)/m\\rceil + 4\\), with no determinism hypothesis. Wrapping this yields the Hopcroft–Ullman speedup corollaries for machines with at least two tapes, proved twice: for deterministic machines, where the result stays deterministic, and with no determinism hypothesis, giving \\(\\mathrm{NTIME}(cn) = \\mathrm{NTIME}((1+\\varepsilon)n)\\) and \\(\\mathrm{NTIME}(T(n)) = \\mathrm{NTIME}(c \\cdot T(n))\\), corollaries Hopcroft and Ullman state without proof. For a linear bound \\(T(n) \\le d_0 n + b\\) and \\(\\varepsilon = 1/q\\), a machine \\(M''\\) with \\(L(M'') = L(M)\\) runs in time \\((1+\\varepsilon)|w| + K\\), \\(K = 28 + 8d_0 + 8b\\), matching Hopcroft–Ullman's \\((1+\\varepsilon)n\\); for super-linear \\(T\\), \\(M''\\) runs in time \\(\\varepsilon\\,T(|w|) + K\\). The clean bound \\((1+\\varepsilon)|w|\\), without \\(K\\), holds for \\(M''\\) once \\(|w|\\) passes the explicit threshold \\(q(q+1)K\\), and for all inputs once the encoder decides the shorter ones from a finite table while reading them, as in Hopcroft and Ullman's proof; that table exists but is not computed.</p>

<p>This session depends on <tt>Multitape_TM_Substrate</tt> and <tt>HOL-Library</tt>.</p>

<p>The Claude family of AI models, via Claude Code, was used for proof engineering.</p>"""
license = "bsd"
note = ""

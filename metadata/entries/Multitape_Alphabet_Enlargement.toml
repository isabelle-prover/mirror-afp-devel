[history]
2026-10-28 = """
Added a convention form of Theorem 12.4 with no additive constant, deciding
short inputs by a finite table as in Hopcroft and Ullman's proof
(Wrap_Prefix_Patch, Wrap_Prefix_Runs), and a speedup theorem above a linear
band (Wrap_Band_Speedup).  Added Wrap_Speedup_Arithmetic, the arithmetic
that turns the raw speedup bound into the (1+ε)n form.  Time bounds now
cover rejecting runs as well as accepting ones, and the encoding wrap
rejects whenever the source does.  Removed lemmas that duplicated the
substrate's or others in this entry, and a vacuous hypothesis of the
speedup theorems.  Names follow the substrate's renaming.  Updated
abstract.
"""
2026-11-10 = """
The block size is a number: alphabet_enlarge m M replaces alphabet_enlarge M,
whose blocks were indexed by a type 'c :: enum, and types lose the parameter
'c.  A block is a function on {..<m}; the enlarged alphabet is gamma_block m
(AlphabetEnlargement_Delta).  The theorems of AlphabetEnlargement, Wrap_Speedup,
Wrap_Convention and Wrap_Band_Speedup assume 0 < m, and their bounds on
card (UNIV :: 'c set) are bounds on m.  Removed c_idx and c_first with their
lemmas; renamed c_succ_idx_some, c_succ_idx_none, c_pred_idx_some,
c_pred_idx_none, encode_input_map_enum and encode_input_map_take_enum to
c_succ_Some, c_succ_None, c_pred_Some, c_pred_None, encode_input_map_symbols
and encode_input_map_take_symbols.  Updated abstract.
"""


title = "Strong Normalization for Church-Style System F"
date = 2026-09-02
topics = [
  "Computer science/Programming languages/Lambda calculi",
  "Computer science/Programming languages/Type systems",
  "Logic/General logic/Mechanization of proofs",
]
abstract = "This entry formalizes strong normalization for Church-style System F with explicit type abstraction and type application. Types and terms use de Bruijn indices; the reduction relation contains both term-\\(\\beta\\) and type-\\(\\beta\\) steps and is closed under all term contexts. The proof combines Girard-style reducibility candidates for an untyped lambda-calculus erasure with an explicit type-syntax measure that reflects the erased normalization result back to the full calculus. The final theorem states that every well-typed System F term is strongly normalizing, so the usual closed-term result is an immediate instance."
license = "bsd"
note = ""
creation_note = "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Isabelle."


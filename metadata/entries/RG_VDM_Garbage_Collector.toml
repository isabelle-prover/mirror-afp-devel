title = "Rely-Guarantee Specification of a Concurrent Garbage Collector"
date = 2026-10-15
topics = [
  "Computer science/Concurrency",
]
abstract = "We specify a model of the Ben-Ari concurrent garbage collector in the rely-guarantee paradigm, and verify its correctness. The aim is to show that the algorithm can be verified with rely-guarantee without the use of shared auxiliary variables. The approach is to reason that a certain property is maintained by one component for all instances of a variable, and then instantiate it to the particular instance required by the rely of the other component."
license = "bsd"
note = ""
creation_note = """
Some of the proofs were initially generated by Claude, and then extensively revised by hand.






"""


[history]
2026-09-08 = "Major extension. Completeness is strengthened to derivation from hypotheses: up to arbitrary pure contexts of open formulas over countable signatures at every infinite carrier, and, by a transfinite extension lemma, to arbitrary signature cardinalities, with the carrier at least as large as the signature and purity scaled to it. A finitary hypothesis relation in the style of Andrews (some finite sub-context derives the conclusion) is introduced, for which completeness needs no purity condition at all; semantic compactness of the Henkin consequence follows as a corollary. Further additions: a choice-free consistency proof; consistency of NK with an infinity scheme by compactness over finite models (theory NK_Infinity, also in the strong finitary form), and a proof that the scheme does not yield the single Dedekind-style axiom of infinity; model existence as a concrete countable Henkin model; a footprint audit (theory Footprint_Checks). The published exports (including cantor_surjective and cantor_injective) are preserved; the document gained an introduction section."


[history]
2026-09-29 = "Major extension. Completeness is strengthened to derivation from hypotheses: up to arbitrary pure contexts of open formulas over countable signatures at every infinite carrier, and, by a transfinite extension lemma, to arbitrary signature cardinalities, with the carrier at least as large as the signature and purity scaled to it. A finitary hypothesis relation in the style of Andrews (some finite sub-context derives the conclusion) is introduced, for which completeness needs no purity condition at all; semantic compactness of the Henkin consequence follows as a corollary. Further additions (theory NK_Infinity): consistency of NK with a scheme of inequations between new individual constants, by compactness over finite models, also in the finitary form; the Dedekind axiom of infinity DInf with its satisfaction conditions in any general model; the axiom derives every constant-free sentence 'there are at least n individuals' inside NK, while neither the constant scheme nor these sentences derive the axiom, and a countable Henkin model of the whole scheme refutes it; model existence as a concrete countable Henkin model; a footprint audit (theory Footprint_Checks). Derived rules for conjunction, the named binders and cut are added to Calculus. The published exports (including cantor_surjective and cantor_injective) are preserved; the document gained an introduction section."


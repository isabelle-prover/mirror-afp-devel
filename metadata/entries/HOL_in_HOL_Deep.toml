title = "A deep embedding of HOL in HOL: soundness, completeness, consistency"
date = 2026-08-05
topics = [
  "Logic/General logic/Mechanization of proofs",
  "Logic/General logic",
]
abstract = """
<p>This entry presents a machine-checked deep embedding of classical
higher-order logic (HOL) in Isabelle/HOL, following the article
<a href=\"https://doi.org/10.2178/jsl/1102022211\"><em>Higher-Order
Semantics and Extensionality</em></a> by Benzmüller, Brown and Kohlhase
(Journal of Symbolic Logic 69(4), 2004; henceforth BKK). Throughout,
HOL means Church's simple theory of types: it is the embedded
<em>object</em> logic, while Isabelle/HOL serves as the ambient
meta-logic. The language of BKK §2 is formalised in a <em>locally
nameless</em> representation, which makes BKK's identification of
α-equivalent terms a literal equality, so that no α-conversion or
bound-variable renaming is needed. The semantics of BKK §3 is rendered
abstractly, up to the class M<sub>βfb</sub> of Σ-Henkin models;
standard models arise as the full special case. The signature includes
BKK's optional primitive equality (Remark 7.9) and — following Andrews'
<em>General Models, Descriptions, and Choice in Type Theory</em> (1972),
beyond BKK — typed description operators.</p>

<p>On this basis the natural-deduction calculus NK of BKK §7 is proved
sound (Theorem 7.3) and Henkin-complete, via the model-existence method
of BKK §6, with the term model realised as a term evaluation.
Completeness holds in a form stronger than BKK's Corollary 7.7: at
every infinite value carrier, for every signature with infinitely many
parameters, and for open formulas. It also holds relative to
hypotheses. For derivability from hypotheses in Andrews' sense — some
finite part of the hypothesis set (the <em>context</em>) derives the
conclusion — any context of open formulas is admitted, over any
infinite signature, once the carrier is at least as large as the
signature; semantic compactness of the Henkin consequence follows. For
the calculus itself, a finite context needs nothing beyond
well-formedness, and over a countable signature a context of open
formulas that leaves infinitely many parameters unused is admitted at
every infinite carrier. Consistency — that ⊥ is not derivable — follows
from a concrete Σ-standard model with finite domains: a single
individual and finitely many non-logical constants suffice, so no axiom
of infinity is assumed for the embedded logic. Model existence is
likewise concrete: from the consistency of a sentence over a countable
signature, a Henkin (general) model of it with countable total domain
is defined in plain HOL — non-effectively, via a maximal-consistent
extension, but with consistency as the only premise.</p>

<p>As an illustration, Cantor's theorem is derived <em>inside</em> NK,
in surjective and injective form and at every type. Finally, three
renderings of infinity are compared. By compactness over arbitrarily
large finite models — the classical argument by expansion with new
constants, applied in type theory in Andrews' §55 to obtain nonstandard
models — NK is consistent with the scheme of inequations
c<sub>i</sub> ≠ c<sub>j</sub> between new individual constants, which
forces infinitely many individuals; the consistency proof constructs no
infinite model. The single Dedekind-style axiom of infinity does not
follow from that scheme: no finite part of the scheme derives it, and a
Henkin model of the whole scheme, countable over a countable signature,
refutes it. Conversely the axiom derives, for every n, the
constant-free sentence that there are at least n individuals — the
classical first-order axiomatisation of infinity — which in turn does
not derive the axiom. To the best of our knowledge, this is the first
machine-checked completeness proof for a deep embedding of HOL over
plain HOL. This contribution is part of the
<a href=\"https://logikey.org\">LogiKEy</a> project.</p>"""
